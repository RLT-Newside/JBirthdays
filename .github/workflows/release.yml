name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue main pushes so two runs never compute the same version tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Biome check
        run: npx biome check src/

      - name: TypeScript check
        run: npx tsc -b

      - name: Run tests
        run: npm test

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing — run scripts/setup-signing.sh once (see README)."
            exit 1
          fi

      - name: Calculate version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web app
        run: npm run build
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jbirthdays.keystore"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="JBirthdays-${{ steps.version.outputs.tag }}.apk"
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools/" | tail -1)/apksigner" sign \
            --ks "$RUNNER_TEMP/jbirthdays.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$SIGNED" \
            "$UNSIGNED"
          rm "$RUNNER_TEMP/jbirthdays.keystore"

      - name: Create release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "JBirthdays ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            "JBirthdays-${{ steps.version.outputs.tag }}.apk"
